<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font:14px/1.45 system-ui,sans-serif;margin:0;background:#0f1117;color:#e6e6e6;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:#8a8f98;font-size:12px;margin-bottom:14px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

  .counts{font-size:12px;color:#8a8f98}
  .counts b{color:#e6e6e6}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid #1d232e;text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#141922;color:#8a8f98;font-weight:600;cursor:pointer;user-select:none}
  tr:hover td{background:#161b26}
  .done td{opacity:.45}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  .b-WAF{background:#3a2a14;color:#ffb74d}
  .b-BLOCKED{background:#3a1f1f;color:#ff8a80}
  .b-RATE_LIMITED{background:#2a2a3a;color:#b39ddb}
  .b-ERROR{background:#2a2030;color:#f48fb1}
  .hint{color:#8a8f98;font-size:12px;max-width:420px}
  .note{width:100%;padding:4px 6px;border-radius:5px;border:1px solid #2a2f3a;background:#12161f;color:#e6e6e6;font-size:12px}
  .email{font-family:ui-monospace,monospace;font-size:12.5px}
  .pw{color:#7cc77c;font-size:11.5px;font-family:ui-monospace,monospace}
  input[type=checkbox]{accent-color:#4caf50;transform:scale(1.15);cursor:pointer}
  .empty{padding:30px;text-align:center;color:#5a6070}
  .toast{position:fixed;bottom:14px;right:14px;background:#1f6f43;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
</style>

const K = "vc_recheck_v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(K)) || {}; } catch(e) {}
const q = document.getElementById("q"), st = document.getElementById("status"),
      hideDone = document.getElementById("hideDone"), showPw = document.getElementById("showPw");
document.getElementById("gen").textContent = "Généré le " + new Date(DATA.generated).toLocaleString() + " — " + DATA.rows.length + " comptes en statut transitoire (WAF/BLOCKED/RATE_LIMITED/ERROR).";

function badge(s){ return `<span class="badge b-${s}">${s}</span>`; }
function statusSort(a,b){ const o={WAF:0,BLOCKED:1,RATE_LIMITED:2,ERROR:3}; return (o[a.status]-o[b.status]) || a.email.localeCompare(b.email); }

function render(){
  const term = q.value.trim().toLowerCase();
  const rows = DATA.rows.slice().sort(statusSort)
    .filter(r => !term || r.email.toLowerCase().includes(term))
    .filter(r => !st.value || r.status === st.value)
    .filter(r => !(hideDone.checked && state[r.email] && state[r.email].done));
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  for (const r of rows){
    const s = state[r.email] || {};
    const tr = document.createElement("tr");
    if (s.done) tr.className = "done";
    const pws = showPw.checked ? `<div class="pw">${r.pw.join(", ") || "—"}</div>` : (r.pw.length ? `<span style="color:#8a8f98">${r.pw.length}</span>` : `<span style="color:#555">—</span>`);
    tr.innerHTML = `<td><input type="checkbox" ${s.done?"checked":""}></td>
      <td class="email">${r.email}</td>
      <td>${badge(r.status)}</td>
      <td class="hint">${escapeHtml(r.hint)}<br><span style="color:#5a6070">${new Date(r.ts).toLocaleString()}</span></td>
      <td>${pws}</td>
      <td><input class="note" type="text" placeholder="note…" value="${escapeAttr(s.note||"")}"></td>`;
    const cb = tr.querySelector("input[type=checkbox]");
    const note = tr.querySelector(".note");
    cb.addEventListener("change", () => {
      const cur = state[r.email] || {};
      cur.done = cb.checked; cur.ts = Date.now();
      state[r.email] = cur; persist(); render();
    });
    note.addEventListener("input", () => {
      const cur = state[r.email] || {};
      cur.note = note.value; state[r.email] = cur; persist();
    });
    tb.appendChild(tr);
  }
  if (!rows.length) tb.innerHTML = '<tr><td colspan="6" class="empty">Aucun compte à afficher</td></tr>';
  const done = DATA.rows.filter(r => state[r.email] && state[r.email].done).length;
  const checked = document.querySelectorAll("#rows input[type=checkbox]:checked").length;
  document.getElementById("cTotal").textContent = DATA.rows.length;
  document.getElementById("cDone").textContent = done;
  document.getElementById("cRemain").textContent = DATA.rows.length - done;
  document.getElementById("cChecked").textContent = checked;
}
function persist(){ localStorage.setItem(K, JSON.stringify(state)); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return (s||"").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function remaining(){ return DATA.rows.filter(r => !(state[r.email] && state[r.email].done)).map(r => r.email); }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 1800); }
document.getElementById("copy").addEventListener("click", async () => {
  const list = remaining();
  try { await navigator.clipboard.writeText(list.join("\n")); toast(list.length + " emails copiés"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=list.join("\n"); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(list.length + " emails copiés"); }
});
document.getElementById("export").addEventListener("click", () => {
  const list = remaining();
  const blob = new Blob([list.join("\n")], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "recheck-restants.txt"; a.click();
  URL.revokeObjectURL(a.href); toast(list.length + " emails exportés");
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Effacer tout l'état de recheck (notes incluses) ?")) { state = {}; localStorage.removeItem(K); render(); toast("État réinitialisé"); }
});
["input","change"].forEach(ev => { q.addEventListener(ev, render); st.addEventListener(ev, render); hideDone.addEventListener("change", render); showPw.addEventListener("change", render); });
render();
</script>
